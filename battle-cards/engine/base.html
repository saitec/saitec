  *{font-variation-settings:'ROND' 100;}

  :root{
    --ink:#3a3a3a;
    --blue:#1f7fe8;   --blue-bg:#d9f0ff;
    --purple:#8a2be2; --purple-bg:#f3e4ff; --purple-band:#f8f0ff;
    --red:#e8473f;    --red-bg:#ffd9d6;    --red-band:#fff0ee;
    --green:#5aaa1e;  --green-bg:#d9f5c9;  --green-band:#eefae6;
    --yellow:#e8a500; --yellow-bg:#fff0bd; --yellow-band:#fff8e6;
  }
  body{ margin:0; background:#EDEDEF; font-family:'Allo',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; }
  .row{ display:flex; flex-wrap:wrap; gap:80px; padding:40px; }
  .card{ width:613px; height:1356px; background:#fff; border-radius:60px; box-sizing:border-box; padding:44px 36px 34px; display:flex; flex-direction:column; flex:none; overflow:hidden; }
  .title{ text-align:center; margin:4px 0 26px; }
  .title .emoji{ font-size:70px; line-height:1; display:block; margin-bottom:14px; }
  .title h1{ display:inline; font-weight:900; font-size:33px; line-height:1.5; text-transform:uppercase; letter-spacing:.02em; color:var(--blue); background:var(--blue-bg); padding:4px 14px; border-radius:12px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .band{ border-radius:40px; padding:22px 26px 20px; margin-bottom:16px; }
  .band.purple{ background:var(--purple-band); } .band.red{ background:var(--red-band); } .band.green{ background:var(--green-band); } .band.yellow{ background:var(--yellow-band); } .band.blue{ background:var(--blue-bg); }
  .lab{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .lab .emoji{ font-size:30px; line-height:1; }
  .lab span{ font-weight:900; font-size:24px; text-transform:uppercase; letter-spacing:.04em; }
  .purple .lab span,.purple h2,.purple .tech{ color:var(--purple); } .red .lab span,.red h2,.red .tech{ color:var(--red); } .green .lab span,.green h2,.green .tech{ color:var(--green); } .yellow .lab span,.yellow h2,.yellow .tech{ color:var(--yellow); } .blue .lab span,.blue h2,.blue .tech{ color:var(--blue); }
  h2{ display:inline; font-weight:900; font-size:22px; line-height:1.7; text-transform:uppercase; letter-spacing:.02em; padding:3px 10px; border-radius:10px; box-decoration-break:clone; -webkit-box-decoration-break:clone; margin:0; }
  .purple h2{ background:var(--purple-bg); } .red h2{ background:var(--red-bg); } .green h2{ background:var(--green-bg); } .yellow h2{ background:var(--yellow-bg); } .blue h2{ background:#bfe3ff; }
  .h2wrap{ margin:0 0 12px; }
  p{ font-family:'Allo',sans-serif; font-weight:700; font-size:22.5px; line-height:1.36; margin:0 0 8px; color:var(--ink); }
  p.tech{ font-family:'Allo',sans-serif; font-weight:700; font-size:17px; text-transform:uppercase; margin:10px 0 2px; }
  .spacer{ flex:1; }
  .foot{ display:flex; justify-content:space-between; align-items:center; padding:12px 10px 0; }
  .who{ display:flex; align-items:center; gap:12px; }
  .who img{ width:52px; height:52px; border-radius:50%; }
  .who div{ font-weight:700; font-size:15px; line-height:1.4; }
  .brand{ font-weight:800; font-size:20px; text-transform:uppercase; color:var(--blue); background:var(--blue-bg); padding:4px 12px; border-radius:10px; }


  /* ---------- saffron theme (Hanuman Chalisa deck) ---------- */
  .theme-saffron{ background:#fffaf3 !important; }
  .theme-saffron .title h1{ color:#d35400; background:#ffe3c2; }
  .theme-saffron .brand{ color:#d35400; background:#ffe3c2; }
  .band.verse{ background:#fff0dc; border:2.5px solid #ffcf9a; }
  .band.saffron{ background:#fff3e6; } .band.marigold{ background:#fff7df; } .band.vermilion{ background:#fff0ea; } .band.sandal{ background:#faf1e2; }
  .verse .lab span,.verse h2,.verse .tech{ color:#b4540a; } .saffron .lab span,.saffron h2,.saffron .tech{ color:#e06a00; }
  .marigold .lab span,.marigold h2,.marigold .tech{ color:#c98500; } .vermilion .lab span,.vermilion h2,.vermilion .tech{ color:#c8321e; } .sandal .lab span,.sandal h2,.sandal .tech{ color:#8a5a12; }
  .verse h2{ background:#ffe0b8; } .saffron h2{ background:#ffe3c2; } .marigold h2{ background:#ffeaa6; } .vermilion h2{ background:#ffd5c8; } .sandal h2{ background:#f1dfc0; }
  p.verse{ font-family:'Allo',sans-serif; font-size:24px; line-height:1.28; color:#7a2e0a; margin:0 0 6px; }
  p.translit{ font-family:'Allo',sans-serif; font-weight:700; font-size:21px; line-height:1.38; color:#7a1f1f; margin:0 0 2px; }
  .band.tr p.translit + p.verse{ margin-top:12px; padding-top:10px; border-top:2px dashed #ffc98f; }
  .band.tr p.verse{ font-size:20.5px; line-height:1.25; color:#8a4a14; margin:0 0 3px; }
  .card.notitle{ justify-content:space-between; } .card.notitle .spacer{ flex:0; } .card.notitle .band{ margin-bottom:0; } .card.notitle .band p:not(.translit):not(.verse){ font-size:22.5px; line-height:1.32; }
  .band.center{ text-align:center; } .band.center .lab{ justify-content:center; }
  .band.big{ padding:30px 26px 26px; margin-bottom:20px; } .band.big .lab span{ font-size:22px; }
  .band.big p.translit{ font-size:25px; line-height:1.4; } .band.big p.verse{ font-size:22px; line-height:1.3; }
  .band.big.doha p.translit{ font-size:22px; line-height:1.32; } .band.big.doha p.verse{ font-size:20.5px; line-height:1.26; }
  .band.doha p.translit{ font-size:19.5px; line-height:1.24; } .band.doha p.verse{ font-size:19.5px; line-height:1.22; } .band.doha p.translit + p.verse{ margin-top:7px; padding-top:7px; }



  /* ---------- krishna theme (Bhagavad Gita deck) ---------- */
  .theme-krishna{ background:#f7faff !important; }
  .theme-krishna .title h1{ color:#1f4e9c; background:#dbe7ff; }
  .theme-krishna .brand{ color:#1f4e9c; background:#dbe7ff; }

  .qtext{ font-family:'Allo',sans-serif; font-weight:800; line-height:1.2; color:#333; letter-spacing:-.005em; }
  .qtext mark{ background:var(--qb); color:var(--qa); padding:0 8px; border-radius:10px; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .qby{ margin-top:24px; font-weight:800; font-size:21px; text-transform:uppercase; letter-spacing:.05em; color:var(--qa); }

  /* ---------- backs (illustrated) ---------- */
  .card.back .title{ margin:4px 0 16px; }
  .card.back .title h1{ font-size:26px; line-height:1.6; }
  .card.back svg.art{ width:541px; height:auto; display:block; }

  .hand{ font-family:'Allo',sans-serif; font-weight:700; }
  .arrow{ stroke-width:9; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .thin{ stroke-width:6; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  /* subtle, purposeful animation. everything settles within ~4s */
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes pop{ from{ opacity:0; transform:scale(.6); } to{ opacity:1; transform:scale(1); } }
  @keyframes rise{ from{ opacity:0; transform:translateY(26px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes grow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  @keyframes climb{ from{ transform:translate(0,0);} to{ transform:translate(92px,-215px);} }
  @keyframes walk{ from{ transform:translateX(0);} to{ transform:translateX(165px);} }
  @keyframes tip{ from{ transform:rotate(0deg);} to{ transform:rotate(22deg);} }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-8px);} }
  .draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.1s ease-out forwards; }
  .pop{ opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .6s cubic-bezier(.2,1.4,.4,1) forwards; }
  .rise{ opacity:0; transform-box:fill-box; animation:rise .7s ease-out forwards; }
  .fade{ opacity:0; animation:fade .8s ease-out forwards; }
  .grow{ transform-box:fill-box; transform-origin:left center; transform:scaleX(0); animation:grow 1s ease-out forwards; }
  .climb{ transform-box:fill-box; animation:climb 2.2s ease-in-out forwards; }
  .walk{ transform-box:fill-box; animation:walk 1.8s ease-in-out forwards; }
  .tip{ transform-box:fill-box; transform-origin:bottom right; animation:tip .5s ease-in forwards; }
  .bob{ transform-box:fill-box; animation:bob 2.4s ease-in-out infinite; }
  @media (max-width:760px){ .row{ zoom:.58; padding:20px; gap:40px; } }

<script>
const HANDLE = "@5aitec", SITE = "5aitec.com";
const AVATAR = "__AVATAR__";
const CARDS = __CARDS__;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const foot = `<div class="foot"><div class="who"><img src="${AVATAR}"><div>${esc(HANDLE)}<br>${esc(SITE)}</div></div><div class="brand">Battle Cards</div></div>`;
function front(c){ return `<div class="card front${c.theme?' theme-'+c.theme:''}${c.noTitle?' notitle':''}" data-num="${c.num}">
  ${c.noTitle?'':`<div class="title"><span class="emoji">${c.emoji}</span><h1>${esc(c.title)}</h1></div>`}
  ${c.bands.map(b=>`<div class="band ${b.color}"><div class="lab"><span class="emoji">${b.emoji}</span><span>${esc(b.label)}</span></div>${b.headline?`<div class="h2wrap"><h2>${esc(b.headline)}</h2></div>`:""}${(b.body||[]).map(t=>t.startsWith("# ")?`<p class="tech">${esc(t.slice(2))}</p>`:t.startsWith("> ")?`<p class="verse">${esc(t.slice(2))}</p>`:t.startsWith("^ ")?`<p class="translit">${esc(t.slice(2))}</p>`:`<p>${esc(t)}</p>`).join("")}</div>`).join("")}
  <div class="spacer"></div>${foot}</div>`; }
function back(c){ return `<div class="card back${c.theme?' theme-'+c.theme:''}" data-num="${c.num}">
  <div class="title"><h1>${c.emoji} ${esc(c.title)}</h1></div>
  <svg class="art" viewBox="0 0 541 1120">${c.svg||""}</svg>
  <div class="spacer"></div>${foot}</div>`; }

function quoteCard(c){
  let q=esc(c.quote); (c.hl||[]).forEach(h=>{ const e=esc(h); q=q.split(e).join('<mark>'+e+'</mark>'); });
  return `<div class="card qcard q-${c.accent||'blue'}" data-num="${c.num}">
  <div class="qlabel">${esc(c.label||'Breaker')}</div>
  <svg class="art qtop" viewBox="0 0 541 300">${c.top||""}</svg>
  <div class="qmid"><div class="qmark">&ldquo;</div><div class="qtext">${q}</div><div class="qby">${esc(c.by)}</div>${c.context?`<div class="qctx">${esc(c.context)}</div>`:''}</div>
  <svg class="art qbot" viewBox="0 0 541 240">${c.bottom||""}</svg>
  ${foot}</div>`; }
function fitQuotes(){ for(const m of document.querySelectorAll('.qmid')){ const t=m.querySelector('.qtext'); let fs=64; t.style.fontSize=fs+'px';
  while(fs>26 && m.scrollHeight>m.clientHeight+1){ fs-=2; t.style.fontSize=fs+'px'; } m.dataset.fs=fs; } }
document.getElementById("row").innerHTML = CARDS.map(c=>front(c)+back(c)).join("");
</script></body></html>
